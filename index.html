<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate Just a Dollar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">  <!-- Hero Section -->  <section class="text-center py-20 bg-gradient-to-r from-blue-500 to-purple-600 text-white">
    <h1 class="text-5xl font-bold mb-4">Donate Just a Dollar</h1>
    <p class="text-xl mb-6">Small change. Massive impact.</p>
    <button onclick="scrollToDonate()" class="bg-white text-blue-600 px-6 py-3 rounded-2xl shadow-lg font-semibold hover:bg-gray-100">Donate Now</button>
  </section>  <!-- About Section -->  <section class="max-w-4xl mx-auto py-16 px-6 text-center">
    <h2 class="text-3xl font-bold mb-4">Why Just $1?</h2>
    <p class="text-lg text-gray-600">If thousands of people donate just $1, we can fund education, food programs, and emergency support for those in need.</p>
  </section>  <!-- Progress Section -->  <section class="bg-white py-16">
    <div class="max-w-4xl mx-auto text-center">
      <h2 class="text-3xl font-bold mb-6">Our Goal</h2>
      <div class="w-full bg-gray-200 rounded-full h-6 mb-4">
        <div id="progressBar" class="bg-green-500 h-6 rounded-full" style="width: 25%"></div>
      </div>
      <p id="progressText" class="text-gray-600">$2,500 raised of $10,000 goal</p>
    </div>
  </section>  <!-- Donate Section -->  <section id="donate" class="py-20 bg-gray-100">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-bold mb-6 text-center">Make a Donation</h2>
      <input type="number" placeholder="Enter amount ($)" class="w-full p-3 border rounded-lg mb-4" id="amount">
      <button onclick="donate()" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-semibold hover:bg-blue-700">Donate</button>
      <p id="message" class="mt-4 text-center text-green-600"></p>
    </div>
  </section>  <!-- Footer -->  <footer class="text-center py-6 bg-gray-800 text-white">
    <p>© 2026 Donate Just a Dollar. All rights reserved.</p>
  </footer>  <script>
    function scrollToDonate() {
      document.getElementById('donate').scrollIntoView({ behavior: 'smooth' });
    }

    function donate() {
      const amount = document.getElementById('amount').value;
      if (amount && amount > 0) {
        document.getElementById('message').innerText = `Thank you for donating $${amount}!`;
      } else {
        document.getElementById('message').innerText = "Please enter a valid amount.";
      }
    }
  </script></body>
</html>
