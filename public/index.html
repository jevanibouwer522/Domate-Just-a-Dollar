<!DOCTYPE html>
<html>
<head>
  <title>Donate Just a Dollar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <section class="text-center py-16 bg-blue-600 text-white">
    <h1 class="text-4xl font-bold">Donate Just a Dollar</h1>
    <p>Small donations. Real impact.</p>
  </section>

  <section class="max-w-md mx-auto bg-white p-6 mt-10 shadow rounded-xl">

    <h2 class="text-xl font-bold mb-4">Donate Now</h2>

    <input id="amount" type="number" placeholder="Enter amount"
      class="w-full p-3 border mb-4 rounded" />

    <button onclick="pay()"
      class="w-full bg-blue-600 text-white p-3 rounded">
      Donate with PayFast
    </button>

    <p id="status" class="text-center mt-4 text-green-600"></p>

  </section>

  <script>
    function pay() {
      const amount = document.getElementById('amount').value;

      if (!amount || amount <= 0) {
        alert("Enter valid amount");
        return;
      }

      fetch("https://YOUR_FIREBASE_FUNCTION_URL/payfast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount })
      })
      .then(res => res.json())
      .then(data => {
        window.location.href = data.redirect_url;
      });
    }
  </script>

</body>
</html>
